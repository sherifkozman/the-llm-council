name: Provider upgrade matrix (manual candidate)

on:
  push:
    branches:
      - codex/provider-matrix-investigation

permissions:
  contents: read

jobs:
  exact-lock-wire:
    name: Locked all-extras synthetic wire validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Sync exact lock and verify synthetic wire tests
        env:
          SAFE_HOME: ${{ runner.temp }}/council-lock-home
          SAFE_UV_CACHE: ${{ runner.temp }}/council-lock-cache
          LOCK_JUNIT: ${{ runner.temp }}/council-lock-junit.xml
        run: |
          set -euo pipefail
          run_clean() {
            env -i \
              PATH="$PATH" \
              HOME="$SAFE_HOME" \
              USERPROFILE="$SAFE_HOME" \
              TMPDIR="${RUNNER_TEMP:-/tmp}" \
              UV_CACHE_DIR="$SAFE_UV_CACHE" \
              PYTHONDONTWRITEBYTECODE=1 \
              "$@"
          }

          run_clean mkdir -p "$SAFE_HOME" "$SAFE_UV_CACHE"
          run_clean uv sync --locked --all-extras --python 3.12.16 \
            --default-index https://pypi.org/simple
          run_clean .venv/bin/python -c 'from importlib.metadata import version; print("locked versions:", ", ".join(f"{name}=={version(name)}" for name in ("pydantic", "pydantic-core", "typing-inspection", "anthropic", "google-genai", "openai")))'

          set +e
          run_clean .venv/bin/python -m pytest -p no:cacheprovider -q \
            --junitxml="$LOCK_JUNIT" \
            tests/test_provider_sdk_wire.py \
            tests/test_cli_contract.py::test_parser_error_remains_stderr_exit_two
          test_status=$?
          set -e

          run_clean .venv/bin/python - "$LOCK_JUNIT" <<'PY'
          import importlib.util
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(sys.argv[1])
          if not report.is_file():
              raise SystemExit(f"JUnit report missing: {report}")

          spec = importlib.util.spec_from_file_location(
              "provider_upgrade_matrix", "scripts/provider-upgrade-matrix.py"
          )
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load provider-upgrade-matrix.py")
          matrix = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = matrix
          spec.loader.exec_module(matrix)
          expected = set().union(*(matrix.EXPECTED[extra] for extra in matrix.EXTRAS))

          cases = list(ET.parse(report).iter("testcase"))
          passed_wire = {
              case.get("name")
              for case in cases
              if case.get("classname", "").endswith("test_provider_sdk_wire")
              and not any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))
          }
          skipped_wire = {
              case.get("name")
              for case in cases
              if case.get("classname", "").endswith("test_provider_sdk_wire")
              and case.find("skipped") is not None
          }
          missing = expected - passed_wire
          print(
              f"wire-required={len(expected)} passed={len(expected & passed_wire)} "
              f"skipped={sorted(expected & skipped_wire)} missing={sorted(missing)}"
          )
          if missing or expected & skipped_wire:
              raise SystemExit(1)

          parser_cases = [
              case
              for case in cases
              if case.get("classname", "").endswith("test_cli_contract")
              and case.get("name") == "test_parser_error_remains_stderr_exit_two"
          ]
          parser_passed = len(parser_cases) == 1 and not any(
              parser_cases[0].find(tag) is not None for tag in ("skipped", "failure", "error")
          )
          print(f"parser-required=1 passed={int(parser_passed)}")
          if not parser_passed:
              raise SystemExit(1)
          PY
          exit "$test_status"

  anthropic-floor-probe:
    name: Anthropic 0.87.0 provider wire floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install floor, record dependencies, and verify synthetic wire tests
        env:
          SAFE_HOME: ${{ runner.temp }}/anthropic-floor-home
          SAFE_UV_CACHE: ${{ runner.temp }}/anthropic-floor-cache
          ANTHROPIC_FLOOR_JUNIT: ${{ runner.temp }}/anthropic-floor-junit.xml
        run: |
          run_clean() {
            env -i \
              PATH="$PATH" \
              SYSTEMROOT="${SYSTEMROOT:-}" \
              WINDIR="${WINDIR:-}" \
              COMSPEC="${COMSPEC:-}" \
              TMP="${TMP:-}" \
              TEMP="${TEMP:-}" \
              HOME="$SAFE_HOME" \
              USERPROFILE="$SAFE_HOME" \
              UV_CACHE_DIR="$SAFE_UV_CACHE" \
              PYTHONDONTWRITEBYTECODE=1 \
              ANTHROPIC_API_KEY='' \
              ANTHROPIC_VERTEX_PROJECT_ID='' \
              ANTHROPIC_FLOOR_JUNIT="$ANTHROPIC_FLOOR_JUNIT" \
              "$@"
          }

          run_clean mkdir -p "$SAFE_HOME" "$SAFE_UV_CACHE"
          run_clean uv venv --python 3.12.16 .venv
          run_clean uv pip install --python .venv/bin/python --default-index https://pypi.org/simple -e '.[vertex,dev]' 'anthropic==0.87.0'
          run_clean .venv/bin/python -c 'from importlib.metadata import version; actual = version("anthropic"); print(f"anthropic=={actual}"); assert actual == "0.87.0", actual'
          run_clean uv pip show --python .venv/bin/python anthropic
          run_clean uv pip check --python .venv/bin/python

          set +e
          run_clean .venv/bin/python -m pytest -p no:cacheprovider -q \
            --junitxml="$ANTHROPIC_FLOOR_JUNIT" \
            'tests/test_provider_sdk_wire.py::test_sdk_serializes_basic_request_and_parses_response[anthropic]' \
            tests/test_provider_sdk_wire.py::test_anthropic_serializes_council_temperature_and_reasoning_together \
            tests/test_provider_sdk_wire.py::test_anthropic_doctor_probes_the_configured_model \
            tests/test_provider_sdk_wire.py::test_anthropic_sdk_maps_structured_output_to_supported_beta_parameter \
            tests/test_provider_sdk_wire.py::test_vertex_anthropic_sdk_serializes_basic_request \
            tests/test_provider_sdk_wire.py::test_vertex_anthropic_sdk_serializes_structured_manual_thinking
          test_status=$?
          set -e

          run_clean .venv/bin/python - "$ANTHROPIC_FLOOR_JUNIT" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(sys.argv[1])
          expected = {
              "test_sdk_serializes_basic_request_and_parses_response[anthropic]",
              "test_anthropic_serializes_council_temperature_and_reasoning_together",
              "test_anthropic_doctor_probes_the_configured_model",
              "test_anthropic_sdk_maps_structured_output_to_supported_beta_parameter",
              "test_vertex_anthropic_sdk_serializes_basic_request",
              "test_vertex_anthropic_sdk_serializes_structured_manual_thinking",
          }
          if not report.is_file():
              raise SystemExit(f"JUnit report missing: {report}")

          cases = [case for case in ET.parse(report).iter("testcase")]
          passed = {
              case.get("name")
              for case in cases
              if case.get("classname", "").endswith("test_provider_sdk_wire")
              and not any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))
          }
          skipped = {
              case.get("name")
              for case in cases
              if case.find("skipped") is not None
          }
          missing = expected - passed
          print(
              f"required={len(expected)} passed={len(expected & passed)} "
              f"skipped={sorted(expected & skipped)} missing={sorted(missing)}"
          )
          if missing or expected & skipped:
              sys.exit(1)
          PY
          exit "$test_status"

  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
        resolution: [lowest-direct, latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Run seven isolated SDK environments
        env:
          COUNCIL_MATRIX_RESOLUTION: ${{ matrix.resolution }}
        run: python scripts/provider-upgrade-matrix.py
      - name: State runner boundary
        if: always()
        run: echo "Intended checks are synthetic SDK MockTransport wire tests and one parser unit test; no native CLI invocation or provider endpoint is part of the test command. The seven environments in this job share a temporary HOME and uv cache, and the hosted runner is shared. This does not prove isolation from runner state or package install/build behavior. The branch push trigger can run again on later pushes; freeze the branch or remove this workflow after its one-time reviewed run. No recurring schedule is configured."

  pydantic-performance:
    name: Pydantic synthetic request model timings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      - name: Compare isolated Pydantic versions on synthetic requests
        env:
          SAFE_HOME: ${{ runner.temp }}/pydantic-bench-home
          SAFE_TMP: ${{ runner.temp }}/pydantic-bench
        run: |
          set -euo pipefail
          run_clean() {
            env -i \
              PATH="$PATH" \
              HOME="$SAFE_HOME" \
              TMPDIR="$SAFE_TMP" \
              PIP_INDEX_URL=https://pypi.org/simple \
              PYTHONDONTWRITEBYTECODE=1 \
              "$@"
          }
          run_clean mkdir -p "$SAFE_HOME" "$SAFE_TMP"
          for v in 2.12.5 2.14.3; do
            run_clean python -m venv "$SAFE_TMP/$v"
            run_clean "$SAFE_TMP/$v/bin/python" -m pip install --no-cache-dir \
              --disable-pip-version-check 'pydantic=='"$v"
            run_clean "$SAFE_TMP/$v/bin/python" -m pip check
          done
          cat > "$SAFE_TMP/bench.py" <<'PY'
          import importlib.util
          import json
          import hashlib
          import sys
          import time
          from importlib.metadata import version

          base_path, expected, trial, output_path = sys.argv[1:]
          spec = importlib.util.spec_from_file_location("provider_base", base_path)
          if spec is None or spec.loader is None:
              raise RuntimeError(base_path)
          base = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = base
          spec.loader.exec_module(base)
          Request = base.GenerateRequest
          if version("pydantic") != expected:
              raise RuntimeError(f"expected {expected}, got {version('pydantic')}")
          payload = {"model": "synthetic", "prompt": "synthetic prompt",
                     "reasoning": {"enabled": True, "thinking_level": "high"},
                     "metadata": {"synthetic": True}}
          input_hash = hashlib.sha256(json.dumps(payload, sort_keys=True).encode()).hexdigest()
          request = Request.model_validate(payload)
          digest = hashlib.sha256(json.dumps(request.model_dump(), sort_keys=True).encode()).hexdigest()
          shared = {name: version(name) for name in
                    ("annotated-types", "typing-extensions", "typing-inspection")}

          def measure(fn):
              for _ in range(100): fn()
              start = time.perf_counter_ns()
              for _ in range(3000): fn()
              return (time.perf_counter_ns() - start) / 3000

          timings = [measure(lambda: Request.model_validate(payload)),
                     measure(request.model_dump),
                     measure(lambda: Request.model_validate(payload).model_dump())]
          with open(output_path, "a", encoding="utf-8") as f:
              f.write(json.dumps([version("pydantic"), version("pydantic-core"), int(trial), input_hash, digest, *timings, shared]) + "\n")
          print(f"pydantic={expected} pydantic-core={version('pydantic-core')} trial={trial} "
                f"validate={timings[0]:.1f} dump={timings[1]:.1f} combined={timings[2]:.1f} ns/op")
          PY
          RESULTS="$SAFE_TMP/results.jsonl"
          BASE_FILE="$GITHUB_WORKSPACE/src/llm_council/providers/base.py"
          for trial in 1 2 3 4 5; do
            if (( trial % 2 == 1 )); then
              versions=(2.12.5 2.14.3)
            else
              versions=(2.14.3 2.12.5)
            fi
            for v in "${versions[@]}"; do
              run_clean "$SAFE_TMP/$v/bin/python" "$SAFE_TMP/bench.py" "$BASE_FILE" "$v" "$trial" "$RESULTS"
            done
          done
          run_clean python - "$RESULTS" <<'PY'
          import json
          import statistics
          import sys
          rows = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8")]
          if len(rows) != 10 or len({(row[3], row[4]) for row in rows}) != 1:
              raise SystemExit("wrong sample count or model_dump outputs differ")
          deps = {json.dumps(row[8], sort_keys=True) for row in rows}
          print("comparison=inconclusive: shared dependency versions differ" if len(deps) != 1
                else f"shared dependencies={next(iter(deps))}")
          for row in rows: print(f"sample pydantic={row[0]} core={row[1]} trial={row[2]} validate={row[5]:.1f} dump={row[6]:.1f} combined={row[7]:.1f} ns/op")
          for v in ("2.12.5", "2.14.3"):
              samples = [row for row in rows if row[0] == v]
              if len(samples) != 5: raise SystemExit(f"wrong sample count for {v}")
              print(f"median pydantic={v} pydantic-core={samples[0][1]}")
              for column, name in ((5, "validate"), (6, "dump"), (7, "combined")):
                  print(f"  {name}={statistics.median(row[column] for row in samples):.1f} ns/op")
          print(f"identical input sha256={rows[0][3]} model_dump sha256={rows[0][4]}")
          PY
