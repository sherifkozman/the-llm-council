name: One-time isolated full CI

on:
  push:
    branches:
      - codex/provider-matrix-investigation

permissions:
  contents: read

jobs:
  full-ci-synthetic:
    name: Full CI (locked, isolated, Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10.22', '3.11.18', '3.12.16']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Sync lock and run full static and synthetic test suite
        env:
          SAFE_HOME: ${{ runner.temp }}/council-ci-home
          SAFE_TMP: ${{ runner.temp }}/council-ci-tmp
          SAFE_UV_CACHE: ${{ runner.temp }}/council-ci-cache
        run: |
          set -euo pipefail
          run_clean() {
            env -i \
              PATH="$PATH" \
              HOME="$SAFE_HOME" \
              USERPROFILE="$SAFE_HOME" \
              TMPDIR="$SAFE_TMP" \
              UV_CACHE_DIR="$SAFE_UV_CACHE" \
              PYTHONDONTWRITEBYTECODE=1 \
              COUNCIL_TEST_NATIVE_CLAUDE=0 \
              COUNCIL_TEST_NATIVE_CODEX=0 \
              "$@"
          }
          run_clean mkdir -p "$SAFE_HOME" "$SAFE_TMP" "$SAFE_UV_CACHE"
          run_clean sh -eu -c '
            for cli in codex claude gemini; do
              if command -v "$cli" >/dev/null 2>&1; then
                printf "Refusing CI run: provider CLI found on PATH: %s\\n" "$cli" >&2
                exit 1
              fi
            done
          '
          run_clean uv sync --locked --all-extras --python '${{ matrix.python-version }}' \
            --default-index https://pypi.org/simple
          run_clean .venv/bin/ruff check src/ tests/
          run_clean .venv/bin/ruff format --check src/ tests/
          run_clean .venv/bin/mypy src/
          run_clean .venv/bin/python -m pytest --cov=llm_council \
            --cov-report=xml --cov-report=term-missing

