[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-llm-council"
version = "0.8.0"
description = "Multi-LLM Council Framework for adversarial debate, cross-validation, and structured decision-making"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sherif Kozman" }
]
keywords = [
    "llm",
    "ai",
    "agents",
    "multi-model",
    "council",
    "adversarial",
    "claude",
    "openai",
    "gemini"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.0",
]
anthropic = ["anthropic>=0.18"]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
google = ["google-genai>=1.0"]
vertex = ["google-genai>=1.0", "google-auth>=2.0", "anthropic[vertex]>=0.18"]
all = [
    "the-llm-council[anthropic,openai,gemini,vertex]"
]

[project.scripts]
council = "llm_council.cli.main:app"

[project.entry-points."llm_council.providers"]
openrouter = "llm_council.providers.openrouter:OpenRouterProvider"
openai = "llm_council.providers.openai:OpenAIProvider"
anthropic = "llm_council.providers.anthropic:AnthropicProvider"
gemini = "llm_council.providers.gemini:GeminiProvider"
vertex-ai = "llm_council.providers.vertex:VertexAIProvider"
claude-code = "llm_council.providers.cli.claude_code:ClaudeCodeCLIProvider"
codex-cli = "llm_council.providers.cli.codex:CodexCLIProvider"
gemini-cli = "llm_council.providers.cli.gemini_cli:GeminiCLIProvider"
sakana = "llm_council.providers.sakana:SakanaProvider"

[project.urls]
Homepage = "https://github.com/sherifkozman/the-llm-council"
Documentation = "https://github.com/sherifkozman/the-llm-council#readme"
Repository = "https://github.com/sherifkozman/the-llm-council"
Issues = "https://github.com/sherifkozman/the-llm-council/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_council"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top (CLI providers need logger setup first)
    "F401",   # Unused import (used for package availability checks)
    "B904",   # Raise without from (valid pattern for re-raising)
    "SIM102", # Nested if statements (readability preference)
    "SIM105", # contextlib.suppress (explicit try/except is clearer)
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

# Ignore missing imports for optional provider packages
[[tool.mypy.overrides]]
module = [
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vulture]
ignore_names = [
    "main",
    "evaluate",
    "evaluate_compare",
    "eval_import_pr",
    "storage_status",
    "storage_migrate",
    "model_config",
    "provider_calls",
    "total_input_tokens",
    "total_output_tokens",
    "degradation_report",
    "routing_execution_plan",
    "streaming_provider",
    "event_loop",
    "side_effect",
    "comment_id",
    "author_login",
    "line_start",
    "line_end",
    "severity",
    "body_text",
    "suggested_code",
    "addressed",
    "is_draft",
    "base_ref",
    "head_ref",
    "additions",
    "deletions",
    "dataset_description",
    "variants_name",
    "variants_description",
    "completed_at",
    "INGESTED",
    "ARCHIVED",
    "CODE_DIFF",
    "STRUCTURED_JSON",
    "ERROR_REPORT",
    "MAX_CAPSULE_TOKENS",
    "openai",
    "anthropic",
    "vertex_ai",
    "openrouter",
]
